general:
  world_frame: "map"
  logging_level: debug
  allow_reset_map_service: true

map_operations:
  - type: threshold_map
    once_every: { seconds: 2.0 }
  - type: prune_map
    once_every: { seconds: 10.0 }
  - type: publish_map
    once_every: { seconds: 0.5 }
    max_num_blocks_per_msg: 50
    topic: "layered_map"

measurement_integrators:
  ouster_os1:
    projection_model:
      type: ouster_projector
      lidar_origin_to_beam_origin: { millimeters: 16.721 }
      lidar_origin_to_sensor_origin_z_offset: { millimeters: 38.195 }
      elevation:
        num_cells: 128
        min_angle: { degrees: -21.39 }
        max_angle: { degrees: 21.25 }
      azimuth:
        num_cells: 1024
        min_angle: { degrees: -180.0 }
        max_angle: { degrees: 180.0 }
    measurement_model:
      type: continuous_beam
      angle_sigma: { degrees: 0.1 }
      range_sigma: { meters: 0.05 }
      scaling_free: 0.2
      scaling_occupied: 0.4
    integration_method:
      type: hashed_wavelet_integrator
      min_range: { meters: 0.5 }
      max_range: { meters: 25.0 }

inputs:
  - type: pointcloud_topic
    topic_name: "/ouster/points"
    topic_type: ouster
    measurement_integrator_names: ouster_os1
    # IG-LIO publishes one map-to-body pose per processed scan. This bag's
    # Ouster t field is not usable as Wavemap-relative per-point time, so asking
    # Wavemap for intermediate poses drops the cloud.
    undistort_motion: false
    topic_queue_length: 10
    max_wait_for_pose: { seconds: 1.0 }
